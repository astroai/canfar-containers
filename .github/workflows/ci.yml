name: canfar-containers CI

# Docker-free gate for the ray-manager module. Image build/test pipelines
# remain operator-side via the Makefile (`make build-all`, `make test-local`,
# `make test-canfar`, …). CI never resolves or checks lockfiles: a new
# upstream release must not fail a PR. Locks move only when a maintainer runs
# `make lock-ray` / `make lock-astroai-lab`; `make lint` checks them locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  manager-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          version: "0.11.32"

      - name: Sync manager project (runtime + dev deps)
        working-directory: ray/manager
        run: uv sync --group dev --quiet

      - name: Ruff
        working-directory: ray/manager
        run: uv run ruff check .

      - name: Pytest (ray-manager unit tests)
        working-directory: ray/manager
        run: uv run pytest tests/ -q

      - name: Docker-free host tests
        run: make test-host
