# Prompt for terminal sessions: path, git, python, slow-command duration.

format = """$directory$git_branch$git_status$python$cmd_duration$character"""

add_newline = false

[directory]
style = "blue"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "green"
format = "[$branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style) "

[python]
symbol = ""
style = "yellow"
format = "[$version]($style) "
detect_extensions = []
detect_files = ["pyproject.toml", "pixi.toml", "requirements.txt"]
detect_folders = [".venv"]

[cmd_duration]
min_time = 2000
style = "purple"
format = "[$duration]($style) "

[kubernetes]
disabled = true

[character]
success_symbol = "[>](bold green) "
error_symbol = "[>](bold red) "
