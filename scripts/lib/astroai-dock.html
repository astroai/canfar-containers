<!-- AstroAI Desk dock — single source asset (canfar-lab src/canfar_lab/data/desk/dock.html).
     Vendored into canfar-containers via scripts/sync-desk-assets.sh; keep both proxies stdlib-only. -->
<meta name="astroai-dock-revision" content="6">
<style>
  #astroai-dock.ad-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 2147483000; height: 44px;
    display: flex; align-items: center; gap: 8px; padding: 0 10px;
    background: #0b1026; color: #dfe4ff; border-bottom: 1px solid rgba(129, 140, 248, 0.22);
    font: 13px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #astroai-dock.ad-bar.ad-hidden { display: none; }
  #astroai-dock.ad-bar .ad-title { font-weight: 700; font-size: 12px; margin-right: 4px; white-space: nowrap; }
  #astroai-dock.ad-bar .ad-buttons { display: flex; align-items: center; gap: 2px; min-width: 0; }
  #astroai-dock.ad-bar .ad-chips { margin-left: auto; display: flex; gap: 5px; }
  #astroai-dock.ad-bar .ad-chip {
    padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.08); color: #a3acd6;
    white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; font-size: 11px;
  }
  #astroai-dock.ad-bar .ad-chip.ok { background: rgba(63,185,80,.18); color: #7ee787; }
  #astroai-dock.ad-bar .ad-chip.warn { background: rgba(210,153,34,.2); color: #e3b341; }
  #astroai-dock.ad-bar button.ad-act, #astroai-dock.ad-bar .ad-toggle {
    border: 1px solid transparent; background: none; color: #c8cff5; cursor: pointer;
    border-radius: 999px; padding: 5px 9px; font: inherit; font-weight: 500; white-space: nowrap;
  }
  #astroai-dock.ad-bar button.ad-act:hover, #astroai-dock.ad-bar .ad-toggle:hover { background: rgba(255,255,255,.1); color: #fff; }
  #astroai-dock.ad-bar button.ad-act.primary { background: rgba(99,102,241,.25); border-color: rgba(129,140,248,.5); }
  #astroai-dock.ad-bar button.ad-act:disabled { opacity: .5; cursor: progress; }
  #astroai-dock.ad-bar .ad-drawer {
    position: absolute; top: 44px; right: 10px; width: min(420px, calc(100% - 20px));
    padding: 8px 10px; border-radius: 8px; background: #10173a; color: #dfe4ff;
    border: 1px solid rgba(129,140,248,.3);
  }
  #astroai-dock.ad-bar .ad-drawer.err { color: #ffb3ad; }
  #astroai-dock.ad-bar .ad-drawer a { color: #79c0ff; }
  #astroai-dock-handle {
    position: fixed; top: 8px; right: 8px; z-index: 2147483000;
    display: flex; align-items: center; padding: 4px 11px; font: 600 12px/1.3 system-ui, sans-serif;
    color: #dfe4ff; background: rgba(11, 16, 38, 0.92);
    border: 1px solid rgba(129, 140, 248, 0.35); border-radius: 999px; cursor: pointer;
  }
  #astroai-dock-handle[hidden] { display: none; }
  @media (max-width: 860px) {
    #astroai-dock.ad-bar .ad-chip { display: none; }
  }
</style>
<div id="astroai-dock" class="ad-bar">
  <span class="ad-title">AstroAI Desk</span>
  <div class="ad-buttons" id="ad-buttons"></div>
  <span class="ad-chips" id="ad-chips"></span>
  <button class="ad-toggle" id="ad-toggle" type="button" title="Hide the Desk bar">Hide</button>
  <div class="ad-drawer" id="ad-drawer" hidden></div>
</div>
<button id="astroai-dock-handle" type="button" hidden title="Show Sync to CANFAR and Launch Studio">Desk</button>
<script>
(function () {
  if (window.__astroaiDockLoaded) { return; }
  window.__astroaiDockLoaded = true;
  var cfgEl = document.getElementById("astroai-dock-config");
  if (!cfgEl) { return; }
  var cfg;
  try { cfg = JSON.parse(cfgEl.textContent || "{}"); } catch (err) { return; }

  var root = document.getElementById("astroai-dock");
  var handle = document.getElementById("astroai-dock-handle");
  if (!root) { return; }
  root.hidden = false;
  var chipsEl = document.getElementById("ad-chips");
  var buttonsEl = document.getElementById("ad-buttons");
  var drawerEl = document.getElementById("ad-drawer");
  var state = null;
  var desk = (cfg.mode || "desk") !== "session";

  function pad(on) {
    var style = document.getElementById("astroai-dock-pad");
    if (!style) {
      style = document.createElement("style");
      style.id = "astroai-dock-pad";
      document.head.appendChild(style);
    }
    style.textContent = on
      ? "body{padding-top:44px!important}#root{height:calc(100vh - 44px)!important;height:calc(100dvh - 44px)!important}"
      : "";
  }

  function applyHidden(hidden) {
    root.classList.toggle("ad-hidden", hidden);
    if (handle) { handle.hidden = !hidden; }
    pad(desk && !hidden);
    try { localStorage.setItem("astroai-dock-hidden", hidden ? "1" : "0"); } catch (err) {}
  }

  // Prefer the user's last Hide/Show. Otherwise start collapsed when the
  // process launched with desk off (CANFAR_LAB_DESK unset) — the Desk
  // handle turns the bar on without a restart.
  var hidden = cfg.enabled === false;
  try {
    var stored = localStorage.getItem("astroai-dock-hidden");
    if (stored === "1" || stored === "0") { hidden = stored === "1"; }
  } catch (err) {}
  applyHidden(hidden);
  document.getElementById("ad-toggle").addEventListener("click", function () { applyHidden(true); });
  if (handle) { handle.addEventListener("click", function () { applyHidden(false); }); }

  function header() { return { "X-Desk-Token": cfg.token, "Content-Type": "application/json" }; }

  function api(url, body, method) {
    return fetch(url, {
      method: method || (body === undefined ? "GET" : "POST"),
      headers: header(),
      body: body === undefined ? undefined : JSON.stringify(body)
    }).then(function (resp) {
      return resp.json().catch(function () { return {}; }).then(function (data) {
        data = data || {};
        if (!resp.ok || data.ok === false) {
          var err = new Error(data.error || ("HTTP " + resp.status));
          err.data = data;
          throw err;
        }
        return data;
      });
    });
  }

  function chip(text, tone) {
    var span = document.createElement("span");
    span.className = "ad-chip" + (tone ? " " + tone : "");
    span.textContent = text;
    span.title = text;
    return span;
  }

  function renderChips() {
    chipsEl.textContent = "";
    var session = state && state.session;
    if (session && session.status) {
      chipsEl.appendChild(chip("session " + session.status, session.status === "Running" ? "ok" : "warn"));
    } else {
      chipsEl.appendChild(chip("no session", "warn"));
    }
    var last = state && state.mailbox && state.mailbox.last_exchange;
    if (last && last.absorbed_at) {
      chipsEl.appendChild(chip("sync " + last.absorbed_at.slice(5, 16) + "Z", "ok"));
    } else if (state && state.mailbox && state.mailbox.session_ready) {
      chipsEl.appendChild(chip("watcher up", "ok"));
    } else {
      chipsEl.appendChild(chip("no watcher", ""));
    }
  }

  function renderButtons() {
    buttonsEl.textContent = "";
    var buttons = (cfg.buttons || []).slice();
    if (state && state.auth && state.auth.authenticated === false) {
      buttons.push({ id: "login", label: "Login", action: "login", title: "Run canfar login in a terminal" });
    }
    buttons.forEach(function (btn) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ad-act" + (btn.kind === "primary" ? " primary" : "");
      b.textContent = btn.label;
      if (btn.title) { b.title = btn.title; }
      b.addEventListener("click", function () { act(btn, b); });
      buttonsEl.appendChild(b);
    });
  }

  function showDrawer(ok, node) {
    drawerEl.textContent = "";
    drawerEl.hidden = false;
    drawerEl.classList.toggle("err", !ok);
    drawerEl.appendChild(node);
  }

  function textNode(text) { return document.createTextNode(text); }

  function summarize(result) {
    var parts = [];
    if (result.report && result.report.summary) {
      Object.keys(result.report.summary).forEach(function (key) {
        parts.push(result.report.summary[key] + " " + key);
      });
    }
    if (result.url) { parts.push(result.url); }
    if (result.opened) { parts.push("opened"); }
    if (result.request) { parts.push("request " + result.request); }
    if (result.session_ready === false) { parts.push("session not ready"); }
    if (result.hint) { parts.push(result.hint); }
    return parts.join(" · ") || "ok";
  }

  function act(btn, node) {
    if (btn.action === "cluster" && (btn.payload || {}).mode === "start") {
      if (!window.confirm("Start the CANFAR Ray cluster (on CANFAR, not locally)?")) { return; }
    }
    if (btn.href) {
      window.open(btn.href + "#" + encodeURIComponent(cfg.token), "_blank");
      return;
    }
    node.disabled = true;
    api(cfg.action_url + "/" + btn.action, btn.payload || {}).then(function (result) {
      var div = document.createElement("div");
      div.appendChild(textNode(btn.label + ": " + summarize(result)));
      if (result.url) {
        div.appendChild(document.createElement("br"));
        var a = document.createElement("a");
        a.href = result.url; a.target = "_blank"; a.rel = "noreferrer";
        a.textContent = "open " + result.url;
        div.appendChild(a);
      }
      showDrawer(true, div);
    }).catch(function (err) {
      var div = document.createElement("div");
      var hint = err.data && err.data.hint ? " — " + err.data.hint : "";
      div.appendChild(textNode(btn.label + " failed: " + (err.message || String(err)) + hint));
      showDrawer(false, div);
    }).finally(function () {
      node.disabled = false;
      refresh(true);
    });
  }

  function refresh(fromAction) {
    if (fromAction) { state = null; }
    api(cfg.state_url).then(function (data) {
      state = data;
      renderChips();
      renderButtons();
    }).catch(function () {});
  }

  renderButtons();
  refresh();
  setInterval(function () { refresh(); }, 4000);
})();
</script>
